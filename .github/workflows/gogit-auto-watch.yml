name: Mini-Kuzai GOGIT AUTO-WATCH

on:
  push:
    branches:
      - main
    paths:
      - 'reports/assistant-results/latest.json'
      - 'reports/assistant-results/history/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: gogit-auto-watch-main
  cancel-in-progress: false

jobs:
  verify-and-review:
    if: ${{ github.repository == 'Kusanagi8200/Mini-Kuzai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed commit without Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests - fail closed
        run: python -m unittest discover -s tests -p 'test_gogit_auto_watch.py' -v

      - name: Verify newly pushed GOGIT and publish analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOGIT_OPENAI_MODEL: ${{ vars.GOGIT_OPENAI_MODEL || 'gpt-5.5' }}
          GOGIT_BEFORE: ${{ github.event.before }}
        run: python tools/gogit_auto_watch.py
